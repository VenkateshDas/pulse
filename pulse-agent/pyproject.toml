[project]
name = "pulse-agent"
version = "0.1.0"
description = "Pulse AI Agent powered by Agno SDK, AgentOS, and Pulse Skill"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agno[os,agui]>=2.2.11",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
