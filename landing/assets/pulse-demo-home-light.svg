<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc"><title id="title">Pulse Home UI demo</title><desc id="desc">Faithful interface replica with entirely fictional sample data. Not a screenshot of a real Mac.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#172126}.muted{fill:#4f6068}.accent{fill:#176b56}.num{font-variant-numeric:tabular-nums}.on-accent{fill:#ffffff}</style>
