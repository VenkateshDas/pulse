<rect x="310" y="488" width="1090" height="350" rx="10" fill="#ffffff" stroke="#ccd5da"/>
<text x="336" y="525" font-size="20" font-weight="600" class="" text-anchor="start">What would you like to do?</text>
<text x="345" y="569" font-size="18" font-weight="550" class="" text-anchor="start">Review cleanup</text>
<text x="345" y="594" font-size="14" font-weight="400" class="muted" text-anchor="start">Choose files to move to Trash. Nothing is removed during a scan.</text>
<path d="M1365 570l5 5-5 5" fill="none" stroke="#4f6068" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M336 609h1036" stroke="#ccd5da"/>
<text x="345" y="642" font-size="18" font-weight="550" class="" text-anchor="start">Remove an app</text>
<text x="345" y="667" font-size="14" font-weight="400" class="muted" text-anchor="start">Review the app and its related files before removing them.</text>
<path d="M1365 643l5 5-5 5" fill="none" stroke="#4f6068" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M336 682h1036" stroke="#ccd5da"/>
<text x="345" y="715" font-size="18" font-weight="550" class="" text-anchor="start">Check a slowdown</text>
<text x="345" y="740" font-size="14" font-weight="400" class="muted" text-anchor="start">See which apps are busy and review the process details.</text>
<path d="M1365 716l5 5-5 5" fill="none" stroke="#4f6068" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M336 755h1036" stroke="#ccd5da"/>
<text x="345" y="788" font-size="18" font-weight="550" class="" text-anchor="start">Adjust brightness</text>
<text x="345" y="813" font-size="14" font-weight="400" class="muted" text-anchor="start">Make your screens more comfortable to use.</text>
