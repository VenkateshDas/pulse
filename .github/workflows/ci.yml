name: CI

# Build + test gate for every change. Required status check on protected
# branches (see CONTRIBUTING.md), so this must stay green to merge.
on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (macOS)
    runs-on: macos-15
    defaults:
      run:
        working-directory: pulse
    steps:
      - uses: actions/checkout@v5

      # swift-tools-version 6.2 — pick the newest stable Xcode the runner ships.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      # CI runners have a healthy toolchain, so the local CLT 26.5 workaround
      # (Makefile fix-toolchain / SWIFTPM_CUSTOM_LIBS_DIR) is neither needed nor
      # wanted here — override the Makefile toolchain settings.
      - name: Build (debug)
        run: make build SWIFT=swift

      - name: Test
        run: make test SWIFT=swift TEST_FLAGS=

      - name: CLI fixture smoke tests
        run: make cli-smoke SWIFT=swift

      - name: Set up Node for Ask Pulse
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pulse-assistant/package-lock.json

      - name: Verify packaged Ask Pulse assets
        run: |
          make assistant
          git diff --exit-code -- Sources/Pulse/Resources/Assistant

      - name: Set up Python for agent contracts
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Agent harness contracts
        run: |
          python -m pip install uv==0.6.5
          make agent-test

      # Smoke-test the release path that CD depends on: a release build must
      # compile and bundle.sh must produce a launchable .app.
      - name: Release build + bundle smoke test
        run: |
          make bundle SWIFT=swift
          test -x dist/Pulse.app/Contents/MacOS/Pulse
